<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel – ASME Material Database</title>

<style>
body { font-family: Arial; background:#f2f4f7; }
.container {
    max-width:1200px; margin:30px auto;
    background:#fff; padding:20px; border-radius:8px;
}
h2 { color:#1f4e79; text-align:center; }
label { font-weight:bold; }
input, select, textarea {
    width:100%; padding:6px; margin:5px 0 10px;
}
button {
    padding:8px 15px; margin:5px;
    background:#1f4e79; color:white; border:none; cursor:pointer;
}
button.danger { background:red; }
button.secondary { background:#777; }
table {
    width:100%; border-collapse:collapse; margin-top:15px;
}
th, td {
    border:1px solid #ccc; padding:6px; text-align:center;
}
th { background:#eef4fb; cursor:pointer; }
.hidden { display:none; }
small { color:#666; }
</style>
</head>

<body>

<div class="container">

<h2>Admin Panel – Material Stress Database</h2>

<!-- 🔐 LOGIN -->
<div id="loginBox">
    <label>Admin Password</label>
    <input type="password" id="adminPass">
    <button onclick="login()">Login</button>
</div>

<!-- ================= ADMIN PANEL ================= -->
<div id="adminPanel" class="hidden">

<h3>Add / Edit Entry</h3>

<label>Code / Standard</label>
<select id="code">
<option>B31.3</option>
<option>B31.8</option>
<option>B31.1</option>
</select>

<label>Material Family</label>
<select id="family">
<option>Carbon Steel</option>
<option>Stainless Steel</option>
<option>Alloy Steel</option>
</select>

<label>Material Type</label>
<select id="mat">
<option value="CS">CS</option>
<option value="SS">SS</option>
<option value="AS">AS</option>
</select>

<label>Material Grade</label>
<input id="grade" placeholder="A106 Gr.B">

<label>Design Temperatures (°C)</label>
<textarea id="temps" placeholder="50, 100, 150"></textarea>
<small>Comma separated – bulk entry supported</small>

<label>Allowable Stress (MPa)</label>
<input id="stress">

<label>Y Factor</label>
<input id="y" value="0.4">

<button onclick="addOrUpdate()">Save Entry</button>

<hr>

<input placeholder="Search (material / grade / temp)" onkeyup="search(this.value)">

<button onclick="exportCSV()">Export CSV</button>
<input type="file" onchange="importCSV(event)">
<button class="danger" onclick="resetDB()">Reset DB</button>

<table>
<thead>
<tr>
<th onclick="sortBy('code')">Code</th>
<th onclick="sortBy('family')">Family</th>
<th onclick="sortBy('mat')">Mat</th>
<th onclick="sortBy('grade')">Grade</th>
<th onclick="sortBy('temp')">Temp</th>
<th onclick="sortBy('stress')">Stress</th>
<th>Y</th>
<th>Action</th>
</tr>
</thead>
<tbody id="dbTable"></tbody>
</table>

</div>
</div>

<script>
// ================= AUTH =================
const PASSWORD = "admin123";

function login(){
    const pass = document.getElementById("adminPass").value;
    const loginBox = document.getElementById("loginBox");
    const adminPanel = document.getElementById("adminPanel");

    if(pass === PASSWORD){
        loginBox.style.display = "none";
        adminPanel.classList.remove("hidden");
        loadTable();
    } else {
        alert("❌ Wrong password");
    }
}

// ================= DATABASE =================
let db = JSON.parse(localStorage.getItem("stressDB")) || [];

// ================= ADD / UPDATE =================
function addOrUpdate(){
    const tempsArr = temps.value.split(",").map(t=>Number(t.trim())).filter(Boolean);

    tempsArr.forEach(t=>{
        if(db.some(r =>
            r.code===code.value &&
            r.mat===mat.value &&
            r.grade===grade.value &&
            r.temp===t
        )){
            alert("⚠ Duplicate entry blocked");
            return;
        }

        db.push({
            code:code.value,
            family:family.value,
            mat:mat.value,
            grade:grade.value,
            temp:t,
            stress:Number(stress.value),
            y:Number(y.value),
            updated:new Date().toISOString()
        });
    });

    save();
}

// ================= SAVE & LOAD =================
function save(){
    localStorage.setItem("stressDB",JSON.stringify(db));
    loadTable();
}

function loadTable(data=db){
    dbTable.innerHTML="";
    data.forEach((r,i)=>{
        dbTable.innerHTML+=`
        <tr>
        <td>${r.code}</td>
        <td>${r.family}</td>
        <td>${r.mat}</td>
        <td>${r.grade}</td>
        <td>${r.temp}</td>
        <td>${r.stress}</td>
        <td>${r.y}</td>
        <td>
            <button onclick="edit(${i})">Edit</button>
            <button class="danger" onclick="del(${i})">Del</button>
        </td>
        </tr>`;
    });
}

// ================= EDIT / DELETE =================
function edit(i){
    const r=db[i];
    code.value=r.code;
    family.value=r.family;
    mat.value=r.mat;
    grade.value=r.grade;
    temps.value=r.temp;
    stress.value=r.stress;
    y.value=r.y;
    del(i,false);
}

function del(i,ask=true){
    if(ask && !confirm("Delete this entry?")) return;
    db.splice(i,1);
    save();
}

// ================= SEARCH =================
function search(q){
    q=q.toLowerCase();
    loadTable(db.filter(r=>JSON.stringify(r).toLowerCase().includes(q)));
}

// ================= SORT =================
function sortBy(k){
    db.sort((a,b)=>a[k]>b[k]?1:-1);
    save();
}

// ================= CSV =================
function exportCSV(){
    let csv="Code,Family,Mat,Grade,Temp,Stress,Y\n";
    db.forEach(r=>{
        csv+=`${r.code},${r.family},${r.mat},${r.grade},${r.temp},${r.stress},${r.y}\n`;
    });
    download(csv,"stressDB.csv");
}

function importCSV(e){
    const f=e.target.files[0];
    const r=new FileReader();
    r.onload=()=>r.result.split("\n").slice(1).forEach(l=>{
        const [c,fm,m,g,t,s,y]=l.split(",");
        if(g) db.push({code:c,family:fm,mat:m,grade:g,temp:Number(t),stress:Number(s),y:Number(y)});
    });
    r.readAsText(f);
    setTimeout(save,500);
}

function download(data,name){
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([data]));
    a.download=name;
    a.click();
}

// ================= RESET =================
function resetDB(){
    if(confirm("Clear complete database?")){
        db=[];
        save();
    }
}
</script>

</body>
</html>
