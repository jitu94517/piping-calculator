<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel – ASME B31.3 Engineering DB</title>

<style>
body { font-family: Arial; background:#f2f4f7; }
.container { max-width:1300px; margin:30px auto; background:#fff; padding:20px; border-radius:8px; }
h2 { color:#1f4e79; text-align:center; }
label { font-weight:bold; }
input, textarea, select { width:100%; padding:6px; margin:5px 0 10px; }
button { padding:8px 15px; background:#1f4e79; color:#fff; border:none; cursor:pointer; margin:5px; }
button.danger { background:red; }
table { width:100%; border-collapse:collapse; margin-top:15px; }
th, td { border:1px solid #ccc; padding:6px; text-align:center; }
th { background:#eef4fb; }
.hidden { display:none; }
small { color:#555; }
hr { margin:20px 0; }
</style>
</head>

<body>

<div class="container">
<h2>Admin Panel – ASME B31.3 (Process Piping)</h2>

<!-- LOGIN -->
<div id="loginBox">
  <label>Admin Password</label>
  <input type="password" id="adminPass">
  <button onclick="login()">Login</button>
</div>

<div id="adminPanel" class="hidden">

<!-- ================= PIPE TYPE MASTER ================= -->
<h3>Pipe Type Master</h3>

<label>Pipe Type</label>
<input id="ptype" placeholder="Seamless / ERW / LSAW">

<label>E Factor</label>
<input id="ptypeE" value="1.0">

<label>W Factor</label>
<input id="ptypeW" value="1.0">

<label>Description</label>
<input id="ptypeDesc">

<button onclick="addPipeType()">Add Pipe Type</button>

<table>
<thead>
<tr>
<th>Pipe Type</th>
<th>E</th>
<th>W</th>
<th>Description</th>
<th>Action</th>
</tr>
</thead>
<tbody id="pipeTypeTable"></tbody>
</table>

<hr>

<!-- ================= MATERIAL STRESS DATABASE ================= -->
<h3>Material Stress Database – ASME B31.3</h3>

<label>Material Family</label>
<input id="family">

<label>Material Type</label>
<input id="mat">

<label>Material Grade</label>
<input id="grade">

<label>Pipe Type</label>
<select id="pipeType" onchange="applyPipeTypeFactors()"></select>

<label>E Factor</label>
<input id="e" readonly>

<label>W Factor</label>
<input id="w" readonly>

<label>Y Factor</label>
<input id="y" value="0.4">

<label>Design Temperatures (°C)</label>
<textarea id="temps" placeholder="50,100"></textarea>

<label>Allowable Stress S (MPa)</label>
<input id="stress">

<button onclick="addMaterial()">Save Material Entry</button>

<table>
<thead>
<tr>
<th>Family</th><th>Type</th><th>Grade</th>
<th>Pipe Type</th><th>T</th>
<th>S</th><th>E</th><th>W</th><th>Y</th>
<th>Action</th>
</tr>
</thead>
<tbody id="materialTable"></tbody>
</table>

</div>
</div>

<script>
const PASSWORD="admin123";
let materialDB = JSON.parse(localStorage.getItem("materialDB")) || [];
let pipeTypeDB = JSON.parse(localStorage.getItem("pipeTypeDB")) || [];

function login(){
  if(adminPass.value===PASSWORD){
    loginBox.style.display="none";
    adminPanel.classList.remove("hidden");
    loadAll();
  } else alert("Wrong password");
}

/* ---------- PIPE TYPE MASTER ---------- */
function addPipeType(){
  if(pipeTypeDB.some(p=>p.type===ptype.value)){
    alert("Pipe type already exists"); return;
  }
  pipeTypeDB.push({
    type:ptype.value,
    E:Number(ptypeE.value),
    W:Number(ptypeW.value),
    desc:ptypeDesc.value
  });
  saveAll();
}

function loadPipeTypes(){
  pipeTypeTable.innerHTML="";
  pipeType.innerHTML="";
  pipeTypeDB.forEach((p,i)=>{
    pipeType.innerHTML+=`<option value="${p.type}">${p.type}</option>`;
    pipeTypeTable.innerHTML+=`
    <tr>
      <td>${p.type}</td><td>${p.E}</td><td>${p.W}</td><td>${p.desc}</td>
      <td><button class="danger" onclick="delPipeType(${i})">Del</button></td>
    </tr>`;
  });
}

function applyPipeTypeFactors(){
  const p = pipeTypeDB.find(x=>x.type===pipeType.value);
  if(p){ e.value=p.E; w.value=p.W; }
}

function delPipeType(i){
  if(confirm("Delete pipe type?")){
    pipeTypeDB.splice(i,1); saveAll();
  }
}

/* ---------- MATERIAL ---------- */
function addMaterial(){
  temps.value.split(",").map(t=>Number(t.trim())).forEach(T=>{
    materialDB.push({
      code:"ASME B31.3",
      family:family.value,
      mat:mat.value,
      grade:grade.value,
      pipeType:pipeType.value,
      temp:T,
      stress:Number(stress.value),
      E:Number(e.value),
      W:Number(w.value),
      Y:Number(y.value)
    });
  });
  saveAll();
}

function loadMaterial(){
  materialTable.innerHTML="";
  materialDB.forEach((r,i)=>{
    materialTable.innerHTML+=`
    <tr>
      <td>${r.family}</td><td>${r.mat}</td><td>${r.grade}</td>
      <td>${r.pipeType}</td><td>${r.temp}</td>
      <td>${r.stress}</td><td>${r.E}</td><td>${r.W}</td><td>${r.Y}</td>
      <td><button class="danger" onclick="delMaterial(${i})">Del</button></td>
    </tr>`;
  });
}

function delMaterial(i){
  if(confirm("Delete entry?")){
    materialDB.splice(i,1); saveAll();
  }
}

/* ---------- SAVE / LOAD ---------- */
function saveAll(){
  localStorage.setItem("materialDB",JSON.stringify(materialDB));
  localStorage.setItem("pipeTypeDB",JSON.stringify(pipeTypeDB));
  loadAll();
}

function loadAll(){
  loadPipeTypes();
  loadMaterial();
}
</script>

</body>
</html>
