<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel – ASME B31.3</title>
<style>
body{font-family:Arial;background:#f2f4f7}
.container{max-width:1200px;margin:20px auto;background:#fff;padding:20px;border-radius:8px}
label{font-weight:bold}
input,select,textarea{width:100%;padding:6px;margin:5px 0 10px}
button{padding:6px 12px;background:#1f4e79;color:#fff;border:none;cursor:pointer}
button.danger{background:red}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#eef4fb}
.hidden{display:none}
</style>
</head>

<body>
<div class="container">
<h2>Admin Panel – ASME B31.3 (Process Piping)</h2>

<div id="loginBox">
<label>Password</label>
<input type="password" id="adminPass">
<button onclick="login()">Login</button>
</div>

<div id="adminPanel" class="hidden">

<!-- ================= PIPE TYPE MASTER ================= -->
<h3>Pipe Type Master</h3>

<input id="ptype" placeholder="Pipe Type (Seamless / ERW)">
<input id="ptypeE" placeholder="E Factor">
<input id="ptypeW" placeholder="W Factor">
<input id="ptypeDesc" placeholder="Description">
<button onclick="savePipeType()">Save Pipe Type</button>

<table>
<thead>
<tr>
<th>Pipe Type</th><th>E</th><th>W</th><th>Description</th><th>Action</th>
</tr>
</thead>
<tbody id="pipeTypeTable"></tbody>
</table>

<hr>

<!-- ================= MATERIAL DATABASE ================= -->
<h3>Material Stress Database – ASME B31.3</h3>

<input id="family" placeholder="Material Family">
<input id="mat" placeholder="Material Type">
<input id="grade" placeholder="Material Grade">

<label>Pipe Type</label>
<select id="pipeTypeSelect" onchange="applyPipeType()"></select>

<input id="e" placeholder="E Factor" readonly>
<input id="w" placeholder="W Factor" readonly>
<input id="y" placeholder="Y Factor">

<textarea id="temps" placeholder="Temperatures e.g. 50,100"></textarea>
<textarea id="stress" placeholder="Stress e.g. 100,90"></textarea>

<button onclick="addMaterial()">Add Material</button>

<table>
<thead>
<tr>
<th>Family</th><th>Type</th><th>Grade</th>
<th>Pipe</th><th>T</th><th>S</th><th>E</th><th>W</th><th>Y</th><th>Action</th>
</tr>
</thead>
<tbody id="materialTable"></tbody>
</table>

</div>
</div>

<script>
const PASSWORD="admin123";
let pipeTypeDB=JSON.parse(localStorage.getItem("pipeTypeDB"))||[];
let materialDB=JSON.parse(localStorage.getItem("materialDB"))||[];
let editPipeIndex=null;

/* LOGIN */
function login(){
 if(adminPass.value===PASSWORD){
  loginBox.style.display="none";
  adminPanel.classList.remove("hidden");
  loadAll();
 } else alert("Wrong Password");
}

/* PIPE TYPE MASTER */
function savePipeType(){
 if(editPipeIndex===null){
  pipeTypeDB.push({
   type:ptype.value,
   E:+ptypeE.value,
   W:+ptypeW.value,
   desc:ptypeDesc.value
  });
 }else{
  pipeTypeDB[editPipeIndex]={
   type:ptype.value,
   E:+ptypeE.value,
   W:+ptypeW.value,
   desc:ptypeDesc.value
  };
  editPipeIndex=null;
 }
 clearPipeForm();
 saveAll();
}

function editPipeType(i){
 const p=pipeTypeDB[i];
 ptype.value=p.type;
 ptypeE.value=p.E;
 ptypeW.value=p.W;
 ptypeDesc.value=p.desc;
 editPipeIndex=i;
}

function delPipeType(i){
 if(confirm("Delete Pipe Type?")){
  pipeTypeDB.splice(i,1);
  saveAll();
 }
}

function loadPipeTypes(){
 pipeTypeTable.innerHTML="";
 pipeTypeSelect.innerHTML="<option value=''>Select</option>";
 pipeTypeDB.forEach((p,i)=>{
  pipeTypeTable.innerHTML+=`
   <tr>
    <td>${p.type}</td><td>${p.E}</td><td>${p.W}</td><td>${p.desc}</td>
    <td>
     <button onclick="editPipeType(${i})">Edit</button>
     <button class="danger" onclick="delPipeType(${i})">Del</button>
    </td>
   </tr>`;
  pipeTypeSelect.innerHTML+=`<option value="${p.type}">${p.type}</option>`;
 });
}

function applyPipeType(){
 const p=pipeTypeDB.find(x=>x.type===pipeTypeSelect.value);
 if(p){ e.value=p.E; w.value=p.W; }
}

function clearPipeForm(){
 ptype.value="";ptypeE.value="";ptypeW.value="";ptypeDesc.value="";
}

/* MATERIAL */
function addMaterial(){
 const tArr=temps.value.split(",").map(Number);
 const sArr=stress.value.split(",").map(Number);
 if(tArr.length!==sArr.length){alert("T & S count mismatch");return;}
 tArr.forEach((T,i)=>{
  materialDB.push({
   family:family.value,
   mat:mat.value,
   grade:grade.value,
   pipe:pipeTypeSelect.value,
   temp:T,
   stress:sArr[i],
   E:+e.value,W:+w.value,Y:+y.value
  });
 });
 saveAll();
}

function loadMaterial(){
 materialTable.innerHTML="";
 materialDB.forEach((r,i)=>{
  materialTable.innerHTML+=`
  <tr>
   <td>${r.family}</td><td>${r.mat}</td><td>${r.grade}</td>
   <td>${r.pipe}</td><td>${r.temp}</td><td>${r.stress}</td>
   <td>${r.E}</td><td>${r.W}</td><td>${r.Y}</td>
   <td><button class="danger" onclick="materialDB.splice(${i},1);saveAll()">Del</button></td>
  </tr>`;
 });
}

/* SAVE / LOAD */
function saveAll(){
 localStorage.setItem("pipeTypeDB",JSON.stringify(pipeTypeDB));
 localStorage.setItem("materialDB",JSON.stringify(materialDB));
 loadAll();
}
function loadAll(){
 loadPipeTypes();
 loadMaterial();
}
</script>
</body>
</html>
