<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel – ASME B31.3</title>
<style>
body{font-family:Arial;background:#f2f4f7}
.container{max-width:1200px;margin:20px auto;background:#fff;padding:20px;border-radius:8px}
label{font-weight:bold}
input,select,textarea{width:100%;padding:6px;margin:5px 0 10px}
button{padding:6px 12px;background:#1f4e79;color:#fff;border:none;cursor:pointer}
button.danger{background:red}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#eef4fb}
.hidden{display:none}
</style>
</head>

<body>
<div class="container">
<h2>Admin Panel – ASME B31.3 (Process Piping)</h2>

<!-- LOGIN -->
<div id="loginBox">
<label>Password</label>
<input type="password" id="adminPass">
<button onclick="login()">Login</button>
</div>

<div id="adminPanel" class="hidden">

<!-- ================= MATERIAL MASTER ================= -->
<h3>Material Master</h3>

<input id="mFamily" placeholder="Material Family">
<input id="mType" placeholder="Material">
<input id="mGrade" placeholder="Grade">
<button onclick="addMaterialMaster()">Add Material</button>

<table>
<thead>
<tr>
<th>Family</th><th>Material</th><th>Grade</th><th>Action</th>
</tr>
</thead>
<tbody id="materialMasterTable"></tbody>
</table>

<hr>

<!-- ================= PIPE TYPE MASTER ================= -->
<h3>Pipe Type Master (E Factor)</h3>

<input id="ptype" placeholder="Pipe Type">
<input id="ptypeE" placeholder="E Factor">
<input id="ptypeDesc" placeholder="Description">
<button onclick="savePipeType()">Save Pipe Type</button>

<table>
<thead>
<tr>
<th>Pipe Type</th><th>E</th><th>Description</th><th>Action</th>
</tr>
</thead>
<tbody id="pipeTypeTable"></tbody>
</table>

<hr>

<!-- ================= Y & W MASTER ================= -->
<h3>Y & W Factor Master (Temp Wise)</h3>

<select id="ywMaterial"></select>
<input id="ywTemp" placeholder="Temperature (°C)">
<input id="ywY" placeholder="Y Factor">
<input id="ywW" placeholder="W Factor">
<button onclick="addYW()">Add Y/W</button>

<table>
<thead>
<tr>
<th>Material</th><th>Temp</th><th>Y</th><th>W</th><th>Action</th>
</tr>
</thead>
<tbody id="ywTable"></tbody>
</table>

<hr>

<!-- ================= MATERIAL STRESS DB ================= -->
<h3>Material Stress Database</h3>

<select id="sMaterial"></select>
<input id="sTemp" placeholder="Temperature (°C)">
<input id="sStress" placeholder="Allowable Stress S (MPa)">
<button onclick="addStress()">Save Stress</button>

<table>
<thead>
<tr>
<th>Material</th><th>Temp</th><th>S</th><th>Action</th>
</tr>
</thead>
<tbody id="stressTable"></tbody>
</table>

</div>
</div>

<script>
const PASSWORD="admin123";

let materialMasterDB = JSON.parse(localStorage.getItem("materialMasterDB")) || [];
let pipeTypeDB = JSON.parse(localStorage.getItem("pipeTypeDB")) || [];
let ywDB = JSON.parse(localStorage.getItem("ywDB")) || [];
let stressDB = JSON.parse(localStorage.getItem("stressDB")) || [];

let editStressIndex=null;

/* LOGIN */
function login(){
 if(adminPass.value===PASSWORD){
  loginBox.style.display="none";
  adminPanel.classList.remove("hidden");
  loadAll();
 } else alert("Wrong password");
}

/* MATERIAL MASTER */
function addMaterialMaster(){
 materialMasterDB.push({
  family:mFamily.value,
  mat:mType.value,
  grade:mGrade.value
 });
 saveAll();
}

function loadMaterialMaster(){
 materialMasterTable.innerHTML="";
 materialMasterDB.forEach((m,i)=>{
  materialMasterTable.innerHTML+=`
  <tr>
   <td>${m.family}</td><td>${m.mat}</td><td>${m.grade}</td>
   <td><button class="danger" onclick="materialMasterDB.splice(${i},1);saveAll()">Del</button></td>
  </tr>`;
 });
}

/* DROPDOWNS */
function loadMaterialDropdowns(){
 ywMaterial.innerHTML="";
 sMaterial.innerHTML="";
 materialMasterDB.forEach((m,i)=>{
  const label=`${m.family} | ${m.mat} | ${m.grade}`;
  ywMaterial.innerHTML+=`<option value="${i}">${label}</option>`;
  sMaterial.innerHTML+=`<option value="${i}">${label}</option>`;
 });
}

/* PIPE TYPE */
function savePipeType(){
 pipeTypeDB.push({type:ptype.value,E:+ptypeE.value,desc:ptypeDesc.value});
 saveAll();
}

function loadPipeTypes(){
 pipeTypeTable.innerHTML="";
 pipeTypeDB.forEach((p,i)=>{
  pipeTypeTable.innerHTML+=`
  <tr>
   <td>${p.type}</td><td>${p.E}</td><td>${p.desc}</td>
   <td><button class="danger" onclick="pipeTypeDB.splice(${i},1);saveAll()">Del</button></td>
  </tr>`;
 });
}

/* Y & W */
function addYW(){
 const m=materialMasterDB[ywMaterial.value];
 ywDB.push({
  material:`${m.family}|${m.mat}|${m.grade}`,
  temp:+ywTemp.value,
  Y:+ywY.value,
  W:+ywW.value
 });
 saveAll();
}

function loadYW(){
 ywTable.innerHTML="";
 ywDB.forEach((r,i)=>{
  ywTable.innerHTML+=`
  <tr>
   <td>${r.material}</td><td>${r.temp}</td><td>${r.Y}</td><td>${r.W}</td>
   <td><button class="danger" onclick="ywDB.splice(${i},1);saveAll()">Del</button></td>
  </tr>`;
 });
}

/* STRESS DB */
function addStress(){
 const m=materialMasterDB[sMaterial.value];
 stressDB.push({
  material:`${m.family}|${m.mat}|${m.grade}`,
  temp:+sTemp.value,
  stress:+sStress.value
 });
 saveAll();
}

function loadStress(){
 stressTable.innerHTML="";
 stressDB.forEach((r,i)=>{
  stressTable.innerHTML+=`
  <tr>
   <td>${r.material}</td><td>${r.temp}</td><td>${r.stress}</td>
   <td><button class="danger" onclick="stressDB.splice(${i},1);saveAll()">Del</button></td>
  </tr>`;
 });
}

/* SAVE / LOAD */
function saveAll(){
 localStorage.setItem("materialMasterDB",JSON.stringify(materialMasterDB));
 localStorage.setItem("pipeTypeDB",JSON.stringify(pipeTypeDB));
 localStorage.setItem("ywDB",JSON.stringify(ywDB));
 localStorage.setItem("stressDB",JSON.stringify(stressDB));
 loadAll();
}
function loadAll(){
 loadMaterialMaster();
 loadMaterialDropdowns();
 loadPipeTypes();
 loadYW();
 loadStress();
}
</script>
</body>
</html>
