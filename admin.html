<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel – Material Database</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f4f7;
}
.container {
    max-width: 900px;
    margin: 30px auto;
    background: #ffffff;
    padding: 20px;
    border-radius: 8px;
}
h2 {
    color: #1f4e79;
    text-align: center;
}
label {
    font-weight: bold;
}
input, select {
    width: 100%;
    padding: 8px;
    margin: 6px 0 12px 0;
}
button {
    padding: 10px 20px;
    background: #1f4e79;
    color: white;
    border: none;
    cursor: pointer;
}
button:hover {
    background: #163a5c;
}
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}
th, td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
}
th {
    background: #e9f1fb;
}
.delete-btn {
    background: red;
    color: white;
    padding: 5px 10px;
    cursor: pointer;
    border: none;
}
</style>
</head>

<body>

<div class="container">
<h2>Material Database – Admin Panel</h2>

<label>Material Type</label>
<select id="mat">
    <option value="CS">Carbon Steel (CS)</option>
    <option value="SS">Stainless Steel (SS)</option>
</select>

<label>Material Grade</label>
<input type="text" id="grade" placeholder="A106 Gr.B">

<label>Design Temperature (°C)</label>
<input type="number" id="temp" placeholder="50">

<label>Allowable Stress (MPa)</label>
<input type="number" id="stress" placeholder="138">

<label>Y Factor</label>
<input type="number" id="y" value="0.4" step="0.1">

<button onclick="addEntry()">Add Entry</button>

<h3>Current Database</h3>
<table>
<thead>
<tr>
    <th>Material</th>
    <th>Grade</th>
    <th>Temp (°C)</th>
    <th>Stress (MPa)</th>
    <th>Y</th>
    <th>Action</th>
</tr>
</thead>
<tbody id="dbTable"></tbody>
</table>

</div>

<script>
// ================= LOCAL STORAGE DATABASE =================
let db = JSON.parse(localStorage.getItem("stressDB")) || [];

// ================= ADD ENTRY =================
function addEntry() {
    const mat = document.getElementById("mat").value;
    const grade = document.getElementById("grade").value.trim();
    const temp = Number(document.getElementById("temp").value);
    const stress = Number(document.getElementById("stress").value);
    const y = Number(document.getElementById("y").value);

    if (!grade || !temp || !stress) {
        alert("❌ Please fill all fields");
        return;
    }

    db.push({ mat, grade, temp, stress, y });
    localStorage.setItem("stressDB", JSON.stringify(db));

    clearInputs();
    loadTable();
}

// ================= LOAD TABLE =================
function loadTable() {
    const tbody = document.getElementById("dbTable");
    tbody.innerHTML = "";

    db.forEach((r, index) => {
        tbody.innerHTML += `
        <tr>
            <td>${r.mat}</td>
            <td>${r.grade}</td>
            <td>${r.temp}</td>
            <td>${r.stress}</td>
            <td>${r.y}</td>
            <td>
                <button class="delete-btn" onclick="deleteEntry(${index})">
                    Delete
                </button>
            </td>
        </tr>`;
    });
}

// ================= DELETE ENTRY =================
function deleteEntry(index) {
    if (!confirm("Delete this entry?")) return;
    db.splice(index, 1);
    localStorage.setItem("stressDB", JSON.stringify(db));
    loadTable();
}

// ================= CLEAR INPUTS =================
function clearInputs() {
    document.getElementById("grade").value = "";
    document.getElementById("temp").value = "";
    document.getElementById("stress").value = "";
}

// ================= INIT =================
loadTable();
</script>

</body>
</html>
